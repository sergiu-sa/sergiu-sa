<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="dotMatrix" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="currentColor" fill-opacity="0.08" />
    </pattern>
  </defs>

  <style>
    .s-bg { fill: #0a0a0c; }
    .s-border { stroke: #26262a; }
    .s-grid { color: #ffffff; }
    .s-hairline { stroke: #26262a; }
    
    .s-meta { fill: #71717a; font-family: ui-monospace, 'SF Mono', 'Fira Code', 'Helvetica Neue', monospace; font-size: 11px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; }
    .s-main-title { fill: #fafafa; font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -0.5px; }
    .s-sub-title { fill: #a1a1aa; font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 400; font-size: 15px; letter-spacing: 0.1px; }
    .s-accent-text { fill: #38bdf8; font-family: ui-monospace, 'SF Mono', 'Fira Code', monospace; font-size: 11px; font-weight: 600; letter-spacing: 1px; }
    .s-badge-bg { fill: #18181b; stroke: #27272a; }
    .s-pill-text { fill: #e4e4e7; font-family: ui-monospace, 'SF Mono', monospace; font-size: 11px; font-weight: 600; }
    .s-cross { stroke: #52525b; stroke-width: 1; }

    @media (prefers-color-scheme: light) {
      .s-bg { fill: #ffffff; }
      .s-border { stroke: #e4e4e7; }
      .s-grid { color: #000000; }
      .s-hairline { stroke: #e4e4e7; }
      
      .s-meta { fill: #71717a; }
      .s-main-title { fill: #09090b; }
      .s-sub-title { fill: #52525b; }
      .s-accent-text { fill: #0284c7; }
      .s-badge-bg { fill: #f4f4f5; stroke: #e4e4e7; }
      .s-pill-text { fill: #18181b; }
      .s-cross { stroke: #a1a1aa; }
    }
  </style>

  <!-- Container -->
  <rect width="920" height="220" rx="4" class="s-bg" />
  <rect width="920" height="220" rx="4" fill="url(#dotMatrix)" class="s-grid" />
  <rect x="0.5" y="0.5" width="919" height="219" rx="3.5" class="s-border" stroke-width="1" fill="none" />

  <!-- Precision Crosshairs (Corners) -->
  <!-- Top-Left -->
  <path d="M16 20 H28 M22 14 V26" class="s-cross" />
  <!-- Top-Right -->
  <path d="M892 20 H904 M898 14 V26" class="s-cross" />
  <!-- Bottom-Left -->
  <path d="M16 200 H28 M22 194 V206" class="s-cross" />
  <!-- Bottom-Right -->
  <path d="M892 200 H904 M898 194 V206" class="s-cross" />

  <!-- Top Metadata Bar -->
  <text x="44" y="38" class="s-meta">SPECIFICATION 01 // FED-2026</text>
  <text x="876" y="38" text-anchor="end" class="s-meta">OSLO, NORWAY [59.91° N, 10.75° E]</text>

  <!-- Divider Line -->
  <line x1="44" y1="52" x2="876" y2="52" class="s-hairline" stroke-width="1" />

  <!-- Main Hero Block -->
  <text x="44" y="98" class="s-main-title">SERGIU SARBU</text>
  <text x="44" y="126" class="s-sub-title">Front-End Developer</text>

  <!-- Second Divider Line -->
  <line x1="44" y1="148" x2="876" y2="148" class="s-hairline" stroke-width="1" />

  <!-- Bottom Technical Strip -->
  <!-- Pill 1: Discipline -->
  <g transform="translate(44, 164)">
    <rect width="175" height="30" rx="3" class="s-badge-bg" stroke-width="1"/>
    <text x="12" y="19" class="s-pill-text">FRONT-END DEVELOPER</text>
  </g>

  <!-- Pill 2: Stack -->
  <g transform="translate(229, 164)">
    <rect width="265" height="30" rx="3" class="s-badge-bg" stroke-width="1"/>
    <text x="12" y="19" class="s-pill-text">REACT · NEXT.JS · TS · TAILWIND</text>
  </g>

  <!-- Pill 3: Education -->
  <g transform="translate(504, 164)">
    <rect width="170" height="30" rx="3" class="s-badge-bg" stroke-width="1"/>
    <text x="12" y="19" class="s-pill-text">NOROFF GRADUATE '26</text>
  </g>

  <!-- Pill 4: Status -->
  <g transform="translate(684, 164)">
    <rect width="192" height="30" rx="3" class="s-badge-bg" stroke-width="1"/>
    <circle cx="16" cy="15" r="3.5" fill="#10b981" />
    <text x="28" y="19" class="s-accent-text">STATUS: AVAILABLE</text>
  </g>
</svg>
