<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 184" width="880" height="184" role="img" aria-labelledby="t">
  <title id="t">Sergiu Sarbu</title>
  <defs>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="rgba(246,178,107,.16)"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="rgba(246,178,107,.7)" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    /* The cursor rests on the heading, DevTools highlights it, then the cursor drifts off and back. */
    .cursor { animation: cursor 8s cubic-bezier(.65, 0, .35, 1) infinite; }
    @keyframes cursor {
      0%, 6% { transform: translate(820px, 30px); }
      18%, 70% { transform: translate(430px, 128px); }
      82%, 100% { transform: translate(820px, 30px); }
    }
    .highlight { animation: highlight 8s steps(1) infinite; }
    @keyframes highlight { 0% { opacity: 0; } 18% { opacity: 1; } 72% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; opacity: 0; }
      .highlight { animation: none; opacity: 1; }
    }
  </style>

  <text class="ui" x="0" y="146" font-size="72" font-weight="700" letter-spacing="-1.5" fill="#f0f6fc">Sergiu Sarbu</text>

