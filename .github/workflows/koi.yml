name: Koi

on:
  schedule:
    # Just after midnight UTC, so the koi shows the day that just ended.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/koi.yml, scripts/koi_card.py]

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    env:
      # white, black, asagi, tea, gold or platinum. The colour key reads it too.
      KOI_BODY: black
    steps:
      - uses: actions/checkout@v7

      - uses: yalongwastaken/git-koi@7305e9b1fadee6f43d3b4fa543a25d4cde79856e # v1.0.2
        with:
          body: ${{ env.KOI_BODY }}
          output-dir: koi-out

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The git-koi step leaves its snapshot in the runner's temp folder; the key reads the same data.
      - name: Draw the koi tile, colour key and scales
        run: |
          pip install --quiet pillow
          python scripts/koi_card.py koi-out/koi.gif "$RUNNER_TEMP/koi-snapshot.json" koi-out

      # A single force-pushed commit on its own branch, so nightly images never pile up in main's history.
      - name: Publish to the koi branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd koi-out
          git init --quiet --initial-branch=koi
          git add koi-dark.gif koi-light.gif key-dark.svg key-light.svg scales-dark.svg scales-light.svg
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --message "koi: draw the day's koi"
          git push --quiet --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" koi
